# OPTIONAL - requires KEDA (https://keda.sh) installed in the cluster:
#   kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.16.0/keda-2.16.0.yaml
# Scales payment workers on stream backlog (unprocessed orders) instead of CPU.
# Remove the CPU HPA first:  kubectl -n ticketrush delete hpa payment-worker
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-worker
  namespace: ticketrush
spec:
  scaleTargetRef:
    name: payment-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: redis-streams
      metadata:
        address: redis.ticketrush.svc.cluster.local:6379
        stream: orders
        consumerGroup: payments
        lagCount: "50"   # roughly one worker per 50 waiting orders
