# Load balancer in front of the gateway replicas (Docker Compose only).
# In Kubernetes the gateway Service plays this role, so nginx is not needed there.

# Docker's embedded DNS. Using a variable in proxy_pass makes nginx re-resolve `gateway`
# every 5 s, so `docker compose up --scale gateway=N` is picked up without a restart.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    set $gateway http://gateway:8000;

    location / {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;         # WebSocket /ws
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
